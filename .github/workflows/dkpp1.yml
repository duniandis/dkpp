name: DKPP1 Auto Runner

on:
  schedule:
    # MASUK (WIB 06:15-08:15) == UTC 23:15-01:15
    - cron: "15-55/10 23 * * *"   # 23:15,23:25,23:35,23:45,23:55
    - cron: "*/10 0 * * *"        # 00:00..00:50
    - cron: "0-10/10 1 * * *"     # 01:00,01:10

    # PULANG (WIB 15:00-18:00) == UTC 08:00-11:00
    - cron: "*/10 8 * * *"        # 08:00..08:50
    - cron: "*/10 9 * * *"        # 09:00..09:50
    - cron: "*/10 10 * * *"       # 10:00..10:50
    - cron: "0 11 * * *"          # 11:00 (18:00 WIB)
  workflow_dispatch:

concurrency:
  group: dkpp-global-queue
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore cache (state, cookie)
        uses: actions/cache@v4
        with:
          path: |
            .cache
            .state
          key: dkpp-auto-${{ github.workflow }}-${{ github.ref_name }}
          restore-keys: |
            dkpp-auto-${{ github.workflow }}-${{ github.ref_name }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run
        env:
          EKIN_USER: ${{ secrets.DKPP1_USER }}
          EKIN_PASS: ${{ secrets.DKPP1_PASS }}

          DEVICE_ID_16: "1dadb39e300a8b56"
          DEVICE_NAME: "vivo Y35"

          WIN_MASUK_START: "06:15:00"
          WIN_MASUK_END: "08:15:00"
          WIN_PULANG_START: "15:00:00"
          WIN_PULANG_END: "18:00:00"

          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}

          MASUK_TARGET_COUNT: "1"
          PULANG_TARGET_COUNT: "1"

        run: |
          python runner.py
