name: DKPP1 Auto Runner

on:
  schedule:
    # MASUK (WIB 07:15-08:15) == UTC 00:15-01:15
    - cron: "15-59 0 * * *"
    - cron: "0-15 1 * * *"

    # PULANG (WIB 15:00-17:00) == UTC 08:00-10:00
    - cron: "* 8 * * *"
    - cron: "* 9 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: dkpp-global-queue
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore cache (state, cookie)
        uses: actions/cache@v4
        with:
          path: |
            .cache
            .state
          key: dkpp-auto-${{ github.workflow }}-${{ github.ref_name }}
          restore-keys: |
            dkpp-auto-${{ github.workflow }}-${{ github.ref_name }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run
        env:
          EKIN_USER: ${{ secrets.DKPP1_USER }}
          EKIN_PASS: ${{ secrets.DKPP1_PASS }}

          DEVICE_ID_16: "1dadb39e300a8b56"
          DEVICE_NAME: "vivo Y35"

          WIN_MASUK_START: "11:00:00"
          WIN_MASUK_END: "12:00:00"
          WIN_PULANG_START: "15:00:00"
          WIN_PULANG_END: "17:00:00"

          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}

          MASUK_TARGET_COUNT: "1"
          PULANG_TARGET_COUNT: "1"

        run: |
          python runner.py
