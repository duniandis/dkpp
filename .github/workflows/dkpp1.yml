name: DKPP1 Auto Runner

on:
  schedule:
    - cron: "1-59/10 * * * *"
  workflow_dispatch:

concurrency:
  group: dkpp-queue-dkpp1
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RUN_KEY: "dkpp1"

      WIN_MASUK_START: "06:15:00"
      WIN_MASUK_END: "08:15:00"
      WIN_PULANG_START: "15:00:00"
      WIN_PULANG_END: "18:00:00"

      MASUK_TARGET_COUNT: "1"
      PULANG_TARGET_COUNT: "1"

      DEVICE_ID_16: "1dadb39e300a8b56"
      DEVICE_NAME: "vivo Y35"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore cache (state, cookie)
        uses: actions/cache@v4
        with:
          path: |
            .cache
            .state
          key: dkpp-auto-v3-${{ env.RUN_KEY }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            dkpp-auto-v3-${{ env.RUN_KEY }}-${{ github.ref_name }}-

      - name: Reset state (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          rm -rf ".state/${RUN_KEY}" ".cache/${RUN_KEY}" || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run
        env:
          EKIN_USER: ${{ secrets.DKPP1_USER }}
          EKIN_PASS: ${{ secrets.DKPP1_PASS }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        run: |
          python runner.py
