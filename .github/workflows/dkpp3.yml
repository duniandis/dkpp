name: DKPP3 Auto Runner

on:
  schedule:
    # MASUK (WIB 06:15-08:15) == UTC 23:15-01:15 (offset +6 menit)
    - cron: "21-51/10 23 * * *"   # 23:21,23:31,23:41,23:51
    - cron: "6-56/10 0 * * *"     # 00:06..00:56
    - cron: "6-16/10 1 * * *"     # 01:06,01:16

    # PULANG (WIB 15:00-18:00) == UTC 08:00-11:00 (offset +6 menit)
    - cron: "6-56/10 8 * * *"     # 08:06..08:56
    - cron: "6-56/10 9 * * *"     # 09:06..09:56
    - cron: "6-56/10 10 * * *"    # 10:06..10:56
    - cron: "6 11 * * *"          # 11:06 (18:06 WIB)
  workflow_dispatch:

concurrency:
  group: dkpp-queue-dkpp3
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RUN_KEY: "dkpp3"

      WIN_MASUK_START: "06:15:00"
      WIN_MASUK_END: "08:15:00"
      WIN_PULANG_START: "15:00:00"
      WIN_PULANG_END: "18:00:00"

      MASUK_TARGET_COUNT: "1"
      PULANG_TARGET_COUNT: "1"

      DEVICE_ID_16: "2add5c8613e69d53"
      DEVICE_NAME: "iPhone XS"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore cache (state, cookie)
        uses: actions/cache@v4
        with:
          path: |
            .cache
            .state
          key: dkpp-auto-v3-${{ env.RUN_KEY }}-${{ github.ref_name }}
          restore-keys: |
            dkpp-auto-v3-${{ env.RUN_KEY }}-${{ github.ref_name }}-

      - name: Reset state (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          rm -rf ".state/${RUN_KEY}" ".cache/${RUN_KEY}" || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run
        env:
          EKIN_USER: ${{ secrets.DKPP3_USER }}
          EKIN_PASS: ${{ secrets.DKPP3_PASS }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        run: |
          python runner.py
