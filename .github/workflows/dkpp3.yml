name: DKPP3 Auto Runner
#Nadya
on:
  schedule:
#    - cron: "2-59/10 * * * *"
#  workflow_dispatch:

concurrency:
  group: dkpp-queue-dkpp3
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RUN_KEY: "dkpp3"

      WIN_MASUK_START: "06:15:00"
      WIN_MASUK_END: "07:15:00"
      WIN_PULANG_START: "15:30:00"
      WIN_PULANG_END: "17:00:00"

      MASUK_TARGET_COUNT: "1"
      PULANG_TARGET_COUNT: "1"

      DEVICE_ID_16: "2add5c8613e69d53"
      DEVICE_NAME: "iPhone XS"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore cache (state, cookie)
        uses: actions/cache@v4
        with:
          path: |
            .cache
            .state
          key: dkpp-auto-v3-${{ env.RUN_KEY }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            dkpp-auto-v3-${{ env.RUN_KEY }}-${{ github.ref_name }}-

      - name: Reset state (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          rm -rf ".state/${RUN_KEY}" ".cache/${RUN_KEY}" || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run
        env:
          EKIN_USER: ${{ secrets.DKPP3_USER }}
          EKIN_PASS: ${{ secrets.DKPP3_PASS }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        run: |
          python runner.py
