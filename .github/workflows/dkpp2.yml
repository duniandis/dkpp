name: DKPP2 Auto Runner

on:
  schedule:
    # PAGI (offset +2) 22:32-01:12 UTC (tetap aman, runner cek window infoday)
    - cron: "32-57/5 22 * * *"
    - cron: "2-57/5 23 * * *"
    - cron: "2-57/5 0 * * *"
    - cron: "2-12/5 1 * * *"     # 01:02,01:07,01:12 (<= 08:12 WIB)

    # SORE (offset +2) 07:32-10:27 UTC (<= 17:27 WIB)
    - cron: "32-57/5 7 * * *"
    - cron: "2-57/5 8 * * *"
    - cron: "2-57/5 9 * * *"
    - cron: "2-27/5 10 * * *"    # 10:02..10:27 (<= 17:27 WIB)
  workflow_dispatch:

concurrency:
  group: dkpp-queue-dkpp2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RUN_KEY: "dkpp2"

      WIN_MASUK_START: "06:15:00"
      WIN_MASUK_END: "08:15:00"
      WIN_PULANG_START: "15:00:00"
      WIN_PULANG_END: "18:00:00"

      MASUK_TARGET_COUNT: "1"
      PULANG_TARGET_COUNT: "1"

      DEVICE_ID_16: "fa3cc87c2bba9428"
      DEVICE_NAME: "iPhone 11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore cache (state, cookie)
        uses: actions/cache@v4
        with:
          path: |
            .cache
            .state
          key: dkpp-auto-v3-${{ env.RUN_KEY }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            dkpp-auto-v3-${{ env.RUN_KEY }}-${{ github.ref_name }}-

      - name: Reset state (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          rm -rf ".state/${RUN_KEY}" ".cache/${RUN_KEY}" || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run
        env:
          EKIN_USER: ${{ secrets.DKPP2_USER }}
          EKIN_PASS: ${{ secrets.DKPP2_PASS }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        run: |
          python runner.py
