name: DKPP2 Auto Runner

on:
  schedule:
    - cron: "*/2 * * * *"   # TEST 5 menit
    # ... cron kamu yang lain
  workflow_dispatch:

concurrency:
  group: dkpp-global-queue
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore cache (state, cookie)
        uses: actions/cache@v4
        with:
          path: |
            .cache
            .state
          key: dkpp-auto-${{ github.workflow }}-${{ github.ref_name }}
          restore-keys: |
            dkpp-auto-${{ github.workflow }}-${{ github.ref_name }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run
        env:
          EKIN_USER: ${{ secrets.DKPP2_USER }}
          EKIN_PASS: ${{ secrets.DKPP2_PASS }}

          DEVICE_ID_16: "fa3cc87c2bba9428"
          DEVICE_NAME: "iPhone 11"

          WIN_MASUK_START: "06:15:00"
          WIN_MASUK_END: "08:15:00"
          WIN_PULANG_START: "15:00:00"
          WIN_PULANG_END: "18:00:00"

          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}

          MASUK_TARGET_COUNT: "1"
          PULANG_TARGET_COUNT: "1"

        run: |
          python runner.py
