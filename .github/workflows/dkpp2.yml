name: DKPP2 Auto Runner

on:
  schedule:
    # MASUK (WIB 06:15-08:15) == UTC 23:15-01:15 (offset +3 menit)
    - cron: "18-58/10 23 * * *"
    - cron: "3-53/10 0 * * *"
    - cron: "3-13/10 1 * * *"

    # PULANG (WIB 15:00-18:00) == UTC 08:00-11:00 (offset +3 menit)
    - cron: "3-53/10 8 * * *"
    - cron: "3-53/10 9 * * *"
    - cron: "3-53/10 10 * * *"
    - cron: "3 11 * * *"
  workflow_dispatch:

concurrency:
  group: dkpp-queue-dkpp2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RUN_KEY: "dkpp2"

      WIN_MASUK_START: "06:15:00"
      WIN_MASUK_END: "08:15:00"
      WIN_PULANG_START: "15:00:00"
      WIN_PULANG_END: "18:00:00"

      MASUK_TARGET_COUNT: "1"
      PULANG_TARGET_COUNT: "1"

      DEVICE_ID_16: "fa3cc87c2bba9428"
      DEVICE_NAME: "iPhone 11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore cache (state, cookie)
        uses: actions/cache@v4
        with:
          path: |
            .cache
            .state
          key: dkpp-auto-v3-${{ env.RUN_KEY }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            dkpp-auto-v3-${{ env.RUN_KEY }}-${{ github.ref_name }}-

      - name: Reset state (manual only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          rm -rf ".state/${RUN_KEY}" ".cache/${RUN_KEY}" || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run
        env:
          EKIN_USER: ${{ secrets.DKPP2_USER }}
          EKIN_PASS: ${{ secrets.DKPP2_PASS }}
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        run: |
          python runner.py
